# Ultralytics YOLO11s-P2-ECA-P2P3 object detection model
# Modified for FracAtlas fracture detection
# Add P2/4 small-object detection head + ECA only on P2 and P3

nc: 1
scale: s

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 2, C3k2, [512, True]]         # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 2, C2PSA, [1024]]             # 10

# YOLO11s-P2 head with ECA only on P2 and P3
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                 # 13 P4 feature

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                 # 16 P3 feature

  # P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat, [1]]                   # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]]                 # 19 P2 feature
  - [-1, 1, ECA, [3]]                           # 20 ECA on P2

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                  # 21
  - [[-1, 16], 1, Concat, [1]]                  # 22 cat head P3
  - [-1, 2, C3k2, [256, False]]                 # 23 P3 feature
  - [-1, 1, ECA, [3]]                           # 24 ECA on P3

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 25
  - [[-1, 13], 1, Concat, [1]]                  # 26 cat head P4
  - [-1, 2, C3k2, [512, False]]                 # 27 P4 feature

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                  # 28
  - [[-1, 10], 1, Concat, [1]]                  # 29 cat backbone P5
  - [-1, 2, C3k2, [1024, True]]                 # 30 P5 feature

  # Detect P2, P3, P4, P5
  - [[20, 24, 27, 30], 1, Detect, [nc]]         # 31 Detect(P2, P3, P4, P5)